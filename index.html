<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Solutions - Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.6rem;
      color: #00f7ff;
      font-weight: bold;
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 0;
    }

    nav ul li a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 6px 8px;
      transition: color 0.25s ease, background 0.25s ease;
      border-radius: 4px;
    }

    nav ul li a:hover {
      color: #fff;
      background: rgba(255,255,255,0.05);
    }

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      text-align: center;
    }

    .hero-content {
      max-width: 800px;
      backdrop-filter: blur(5px);
      background: rgba(0,0,0,0);
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0);
    }

    .hero-content h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      color: #00bcd4;
      line-height: 1.1;
    }

    .hero-content p {
      font-size: 1.1rem;
      color: #ddd;
      margin-top: 10px;
    }

.video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }


    /* Footer */
    footer {
      background-color: rgba(0, 0, 0, 0.85);
      color: #ccc;
      padding: 50px 20px 20px;
      margin-top: 40px;
    }

    .footer-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      max-width: 1100px;
      margin: auto;
      gap: 30px;
    }

    .footer-section {
      flex: 1 1 220px;
      min-width: 180px;
    }

    .footer-section h3 {
      color: #00bcd4;
      margin-bottom: 14px;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .footer-section p {
      margin: 6px 0;
      font-size: 0.9rem;
    }

    .footer-section a {
      color: #ccc;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-section a:hover {
      color: #fff;
    }

    .footer-bottom {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: #999;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 15px;
    }

    @media (max-width: 900px) {
      .hero-content h1 {
        font-size: 2.2rem;
      }
      nav ul {
        gap: 10px;
      }
      .footer-content {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
<video class="video-bg" autoplay muted loop playsinline poster="images/fallback.jpg">
    <source src="AIBG.mp4" type="video/mp4">
    <!-- fallback: nothing, overlay/gradient stays -->
  </video>
  <div class="overlay"></div>

  <header>
    <nav>
      <a href="index.html" class="logo">AI Solutions</a>
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="feature.html">Feature</a></li>
        <li><a href="courses.html">Courses</a></li>
		<li><a href="history.html">AI History</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Empowering the Future with AI</h1>
      <p><b><h3>Innovative. Ethical. Intelligent. 
	  Build intelligent systems, learn modern courses, 
	  and explore the history of artificial intelligence all under one roof.</h3></b></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
